name = "iltan-raumscan"
main = "worker.js"
compatibility_date = "2026-10-01"

# KV for the per-IP daily limit. Create it with:
#   npx wrangler kv namespace create RL
# then paste the id below.
[[kv_namespaces]]
binding = "RL"
id = "PASTE_KV_ID_HERE"

[vars]
DAILY_LIMIT = "8"
# MODEL = "claude-sonnet-5-5"

# The API key is a secret, never put it in this file:
#   npx wrangler secret put ANTHROPIC_API_KEY
